<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etapa 08 — PUT</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <a class="btn btn-outline-secondary mb-4" href="../../index.html">← Voltar</a>
      <section class="card shadow-sm mx-auto" style="max-width: 850px">
        <div class="card-body p-4 p-lg-5">
          <span class="badge text-bg-info">Etapa 08</span>
          <h1 class="h2 mt-3">Atualizar um post com PUT</h1>
          <div class="alert alert-info">
            <strong>PUT</strong> atualiza um recurso existente. O ID vai na URL
            e os novos dados são enviados em JSON.
          </div>

          <form id="form-put">
            <div class="mb-3">
              <label class="form-label" for="post-id">ID do post</label>
              <input class="form-control" id="post-id" type="number" min="1" value="1" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="put-title">Novo título</label>
              <input class="form-control" id="put-title" type="text" value="Título atualizado" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="put-body">Novo conteúdo</label>
              <textarea class="form-control" id="put-body" rows="4">Conteúdo enviado com PUT.</textarea>
            </div>
            <button class="btn btn-info" type="submit">Atualizar com PUT</button>
          </form>

          <div class="alert d-none mt-3" id="status" role="status"></div>
          <pre class="bg-dark text-white rounded p-3 mt-3 mb-0" id="saida">Envie o formulário para ver o retorno.</pre>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
